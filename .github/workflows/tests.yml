name: tests

# Hai hệ điều hành, vì xưởng viết phải chạy được trên cả máy Windows lẫn máy Mac. CI CỐ Ý chỉ cài
# `requirements-dev.txt` (jsonschema, PyYAML, pytest): `underthesea` và `python-docx` là thư viện
# tuỳ chọn, bộ test phải xanh trên máy trần — test nào cần chúng thì tự bỏ qua có lý do.
#
# `push` KHÔNG lọc nhánh: nhánh làm việc cũng phải được đo trước khi mở pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # Đầu dưới đã hứa (3.10), bản máy dựng đang chạy (3.12) và bản mới nhất (3.13).
        python-version: ['3.10', '3.12', '3.13']
    steps:
      # Action ghim theo SHA commit, không theo tag: tag là con trỏ di động.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cài thư viện test
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      # Repo cam kết hai runner cho CÙNG một con số — chạy cả hai, không chọn một.
      - name: pytest
        run: python -m pytest tests -q

      - name: unittest
        run: python -m unittest discover -s tests -t .
